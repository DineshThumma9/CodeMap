services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centralgpt_app
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrantdb:6333
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/centralgpt
      - FALKORDB_URL=redis://falkordb:6379
      - FALKORDB_USER=falkordb
    depends_on:
      - redis
      - qdrantdb
      - postgres
      - falkordb
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centralgpt_celery
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrantdb:6333
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/centralgpt
      - FALKORDB_URL=redis://falkordb:6379
      - FALKORDB_USER=falkordb
    depends_on:
      - redis
      - qdrantdb
      - postgres
      - falkordb
    volumes:
      - .:/app
    command: celery -A src.service.background.worker.queue worker --loglevel=info --concurrency=2

  qdrantdb:
    image: qdrant/qdrant
    container_name: qdrantdb
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15-alpine
    container_name: postgresdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=centralgpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6380:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data

  redis:
    image: redis:6.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  falkordb_data:
  caddy_data:
  caddy_config:
